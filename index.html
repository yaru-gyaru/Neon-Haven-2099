<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21132b"><title>Neon Haven 2099 · Тихий балкон</title><link rel="stylesheet" href="game.css"></head><body>
<main class="game" aria-label="Интерактивный пиксельный балкон"><div class="world" id="world"><img class="backdrop" src="assets/balcony-clean.png" alt="Уютный розово-фиолетовый пиксельный балкон над ночным городом. Кресло с пледом, гирлянда, проигрыватель, растения и спящий кот."><canvas id="weather" aria-hidden="true"></canvas><div id="light-glow" aria-hidden="true"></div><div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
<button class="hotspot cat" id="cat" aria-label="Погладить спящего кота"><span class="sleep">z z Z</span><span class="object-label">ПОГЛАДИТЬ</span></button>
<button class="hotspot cup" id="cup" aria-label="Выпить горячий чай"><span class="object-label">ГЛОТОК ТЕПЛА</span></button>
<button class="hotspot turntable" id="turntable" aria-label="Включить или остановить проигрыватель"><span class="object-label">ВКЛЮЧИТЬ ВИНИЛ</span></button>
<button class="hotspot lights" id="lights" aria-label="Приглушить гирлянду" aria-pressed="false"><span class="object-label">ГИРЛЯНДА</span></button>
</div>
<div class="hud top"><span class="game-title">NEON HAVEN <b>2099</b></span><span class="time"><span class="dot"></span> TOKYO <time id="clock"></time></span><button id="help" aria-label="Показать интерактивные предметы" aria-pressed="false">?</button></div>
<div id="toast" class="toast" role="status" aria-live="polite">Твой маленький мир. Можно никуда не спешить.</div>
<div class="hud bottom"><button id="play" aria-label="Включить звук" aria-pressed="false">▶ <span>ЗВУК</span></button><button id="mixer-toggle" aria-label="Открыть микшер" aria-expanded="false">♫ <span>МИКШЕР</span></button><div class="now"><i></i><span id="track-name">Midnight in Shinjuku</span></div><button id="next" aria-label="Следующая пластинка">▸▸</button><button id="motion" aria-label="Приостановить анимацию" aria-pressed="false">≈</button><button id="fullscreen" aria-label="Полный экран">⛶</button></div>
<section id="mixer" class="mixer" hidden aria-label="Настройка звука"><div>НОЧНЫЕ ЗВУКИ <button id="close-mixer" aria-label="Закрыть микшер">×</button></div><label class="record-label">КОЛЛЕКЦИЯ ПЛАСТИНОК<select id="record-select" aria-label="Выбрать пластинку"></select><small id="record-info"></small></label><label>ДОЖДЬ <output id="rain-val">70%</output><input id="rain" type="range" min="0" max="100" value="70"></label><label>ГОРОД <output id="city-val">30%</output><input id="hum" type="range" min="0" max="100" value="30"></label><label>МУЗЫКА <output id="music-val">50%</output><input id="music" type="range" min="0" max="100" value="50"></label></section>
<div class="start" id="start"><div class="start-card"><span>夜の隠れ家</span><h1>NEON<br>HAVEN</h1><p>Дождь за окном.<br>Тёплый чай. Сонный кот.</p><button id="enter">ВОЙТИ НА БАЛКОН ▶</button><button id="enter-silent">Войти без звука</button><small>Наведи на кота или коснись его.<br>Исследуй предметы вокруг.</small></div></div>
</main><script src="music.js"></script><script src="cat-sprite.js"></script><script src="game.js"></script></body></html>
